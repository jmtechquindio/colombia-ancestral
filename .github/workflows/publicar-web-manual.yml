name: Publicar COLOMBIA ANCESTRAL

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/publicar-web-manual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar los archivos públicos del museo
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar el museo
        id: deployment
        uses: actions/deploy-pages@v4
