name: Validar prototipo web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/validar-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/validar-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-html-y-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar estructura HTML y sintaxis JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const files = fs.readdirSync('web').filter(f => f.endsWith('.html'));
          if (!files.length) throw new Error('No se encontraron páginas HTML.');
          for (const file of files) {
            const html = fs.readFileSync('web/' + file, 'utf8');
            const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
            for (let i = 0; i < scripts.length; i++) new vm.Script(scripts[i][1], { filename: `${file}:script-${i + 1}` });
            if (!/^<!doctype html>/i.test(html.trim())) throw new Error(file + ': falta <!doctype html>');
            if (!/<html\\b[^>]*lang="es"/i.test(html)) throw new Error(file + ': falta idioma español en html');
            if (!/<meta\\s+name="viewport"/i.test(html)) throw new Error(file + ': falta meta viewport');
            if (!/<title>[^<]+<\\/title>/i.test(html)) throw new Error(file + ': falta un título de página descriptivo');
            console.log('OK:', file, '-', scripts.length, 'bloques JavaScript revisados');
          }
          NODE
      - name: Revisar básicos de accesibilidad y enlaces locales
        run: |
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
                  self.controls=[]
                  self.labels=[]
                  self.images=[]
                  self.h1=0
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag in ('a','link') and a.get('href'):
                      self.links.append((a['href'], a.get('aria-label'), a.get('title')))
                  if tag in ('input','select','textarea') and a.get('type') not in ('hidden',):
                      self.controls.append((tag,a))
                  if tag == 'label' and a.get('for'):
                      self.labels.append(a['for'])
                  if tag == 'img':
                      self.images.append(a)
                  if tag == 'h1':
                      self.h1 += 1
              def handle_data(self, data):
                  pass

          root=Path('web')
          errors=[]
          for page in sorted(root.glob('*.html')):
              html=page.read_text(encoding='utf-8')
              parser=Audit()
              parser.feed(html)
              for href,aria,title in parser.links:
                  u=urlparse(href)
                  if href.startswith(('#','mailto:','tel:')) or u.scheme or u.netloc:
                      continue
                  target=(page.parent/u.path).resolve()
                  if not target.exists():
                      errors.append(f'{page}: enlace local roto: {href}')
              for i,img in enumerate(parser.images,1):
                  if 'alt' not in img:
                      errors.append(f'{page}: imagen {i} sin atributo alt (usar alt="" si es decorativa)')
              for tag,attrs in parser.controls:
                  if attrs.get('aria-label') or attrs.get('aria-labelledby'):
                      continue
                  if attrs.get('id') and attrs['id'] in parser.labels:
                      continue
                  errors.append(f'{page}: control <{tag}> sin etiqueta accesible (id/label o aria-label)')
              if parser.h1 != 1:
                  errors.append(f'{page}: se esperaba un único h1; encontrados {parser.h1}')
              for href,aria,title in parser.links:
                  # La verificación de nombres de enlace completos requiere análisis del texto interno; el test comprueba los casos vacíos.
                  pass
              print(f'REVISADO: {page} | h1={parser.h1} | enlaces={len(parser.links)} | controles={len(parser.controls)} | imágenes={len(parser.images)}')
          if errors:
              print('\\n'.join(errors))
              raise SystemExit(1)
          print('OK: enlaces locales, imágenes con alt, etiquetas de controles y un h1 por página')
          PY
