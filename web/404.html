<style>:root{--deep:#102725;--paper:#f5f0e5;--ink:#173432;--gold:#e5b96e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}.card{max-width:620px;background:#fffdf7;border:1px solid #d9dfd3;border-radius:1.3rem;padding:clamp(1.5rem,5vw,3rem)}h1{font:clamp(2.3rem,6vw,4rem)/1 Georgia,serif;margin:.5rem 0}a{display:inline-block;background:var(--deep);color:white;text-decoration:none;padding:.8rem 1rem;border-radius:99px;margin-top:.5rem}.tag{font-weight:800;letter-spacing:.15em;color:#a8583d;font-size:.75rem}
/* Sistema visual COLOMBIA ANCESTRAL: coherencia entre espacios del museo */
:root{--ink:#183a34;--deep:#102b28;--leaf:#356b54;--gold:#efc477;--paper:#f7f3e9;--white:#fffdf8;--line:#d8dfd1;--muted:#5e7168}
body{background-color:var(--paper);background-image:radial-gradient(ellipse at 8% 5%,#dce6d333 0,transparent 32%);line-height:1.68}
header{background:radial-gradient(ellipse at 88% 0,#28523f 0,transparent 46%),var(--deep);border-bottom:4px solid #d6ad64;box-shadow:0 8px 25px #102b2810}
header strong{letter-spacing:.09em}
main{padding-top:clamp(1.5rem,4vw,3rem);padding-bottom:4rem}
h1,h2,h3{letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,5.5vw,3.8rem);text-wrap:balance}
h2{font-size:clamp(1.55rem,3vw,2.15rem)}
.intro,.activity,.note,.entry,.term,.source,.source-card,.panel,.content-card,.not-found{background:var(--white);border-color:var(--line);box-shadow:0 7px 24px #10272508;border-radius:1rem}
a{color:#245b4b;text-underline-offset:3px;text-decoration-thickness:1.4px}
a:hover{color:#a64f35}
button,.btn{min-height:42px;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
button:hover,.btn:hover{transform:translateY(-1px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b56b36;outline-offset:3px}
input,select,textarea{border-radius:.65rem}
.tag{background:#e5eee3;color:#2e5b46}
footer{background:radial-gradient(ellipse at 80% 0,#234c3c 0,transparent 45%),var(--deep);border-top:4px solid #d6ad64}
footer a{color:var(--gold)}
@media(prefers-reduced-motion:reduce){button,.btn{transition:none}button:hover,.btn:hover{transform:none}}

</style></head>
